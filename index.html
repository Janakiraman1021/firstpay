<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOD Calculation</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f4f4f4;
            margin: 0;
        }
        .container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 90%;
            max-width: 400px;
        }
        input {
            width: 80%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
        }
        button {
            background-color: #007BFF;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        #result {
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
            color: #333;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>LOD Calculation</h2>
        <input type="number" id="inputA" placeholder="Enter A">
        <input type="number" id="inputB" placeholder="Enter B">
        <button onclick="calculateLOD()">Calculate</button>
        <div id="result"></div>
    </div>

    <script>
        function calculateLOD() {
            let A = parseFloat(document.getElementById("inputA").value);
            let B = parseFloat(document.getElementById("inputB").value);
            if (isNaN(A) || isNaN(B) || A === 0) {
                document.getElementById("result").innerText = "Please enter valid numbers and A should not be zero.";
                return;
            }
            let result = ((A - B) / A) * 100;
            document.getElementById("result").innerText = `Result: ${result.toFixed(2)}%`;
        }
    </script>
</body>
</html>
